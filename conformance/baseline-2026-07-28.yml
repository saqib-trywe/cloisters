# Expected conformance failures at 2026-07-28, for `conformance server --requirements 2026-07-28`.
#
# Each entry is a scenario cloisters cannot pass by design: the suite's own fixture tools (test_*, greet,
# slow_compute, ...), or resources, prompts, completion, logging, sampling, elicitation, tasks and
# input-required results, none of which cloisters offers (tools only; ADR 0001). server-stateless and caching
# are listed check by check, so their applicable checks stay enforced. Warnings count as failures here too. A
# passing entry fails the run as stale: remove it.
