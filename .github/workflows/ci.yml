name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: deps-${{ runner.os }}-${{ hashFiles('deps.edn') }}
      - name: Node tooling (the pinned MCP conformance suite)
        run: npm ci && npx conformance --version
      - name: Lint
        run: clojure -M:lint
      - name: Format
        run: clojure -M:fmt check
      - name: Test (against real temporary SQLite files, including migrating a non-empty store)
        run: clojure -M:test
      - name: Daemon uberjar
        run: clojure -T:build uber
      - name: MCP conformance at 2025-11-25 and 2026-07-28, against the expected-failures baselines
        run: scripts/conformance.sh
      - name: CLI gate (cloisters search under 100 ms at the median; daemon run, export, stop and restore)
        run: scripts/cli-gate.sh
